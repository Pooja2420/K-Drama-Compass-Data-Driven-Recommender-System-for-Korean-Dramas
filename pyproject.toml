[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kdrama-compass"
version = "1.0.0"
description = "Data-driven recommender system for Korean dramas"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pooja Mohan" }]

dependencies = [
    # Core data science
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",

    # NLP & Sentiment
    "transformers>=4.35",
    "torch>=2.0",
    "textblob>=0.17",
    "nltk>=3.8",

    # Recommendation
    "networkx>=3.1",

    # Visualisation
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",

    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.4",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",

    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",

    # MLOps
    "mlflow>=2.8",

    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "notebook>=7.1",
]

[project.scripts]
kdrama-serve  = "src.api.main:start"
kdrama-train  = "scripts.run_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src"]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",
    "B008", "B905",
    "UP006", "UP007", "UP035",  # Optional/Dict/List needed for Pydantic + Python 3.9
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

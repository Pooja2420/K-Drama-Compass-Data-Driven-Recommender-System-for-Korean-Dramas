services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kdrama-compass:latest
    container_name: kdrama-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://kdrama:kdrama@postgres:5432/kdrama
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: kdrama-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://kdrama:kdrama@postgres:5432/mlflow
        --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kdrama-postgres
    environment:
      POSTGRES_USER: kdrama
      POSTGRES_PASSWORD: kdrama
      POSTGRES_MULTIPLE_DATABASES: kdrama,mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdrama"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  mlflow-artifacts:
